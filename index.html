<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Lưu Trữ - Đam Mỹ Thư Quán</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-color: #f1f1f1;
            --accent-color: #FFD700;
            --border-color: #333333;
            --sidebar-bg: #111111;
        }

        [data-theme="light"] {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #b7950b;
            --border-color: #e2e8f0;
            --sidebar-bg: #edf2f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle, .btn-home {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .theme-toggle:hover, .btn-home:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .main-container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .filter-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            background: var(--sidebar-bg);
        }

        .checkbox-container label {
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--card-bg);
            padding: 4px 8px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
        }

        .content-area {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            min-height: 500px;
        }

        .section-title {
            color: var(--accent-color);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            font-weight: 700;
        }

        .az-filter {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .az-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 3px 7px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .az-btn:hover, .az-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .story-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .story-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .story-card {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .story-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .story-meta {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        .story-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tag-badge {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .read-btn {
            text-align: center;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            display: block;
            font-weight: 600;
        }

        .read-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .page-btn:hover, .page-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            font-weight: bold;
        }

        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
        }

        .widget h3 {
            color: var(--accent-color);
            font-size: 1rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 4px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .facebook-fanpage { background: #1877f2; }
        .facebook-group { background: #050505; border: 1px solid #333; }
        .web-link { background: var(--accent-color); color: #000; }

        .social-btn:hover { opacity: 0.9; }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
            font-style: italic;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo">
            <h1>GÓC LƯU TRỮ</h1>
        </div>
        <div class="header-controls">
            <button class="btn-home" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> Trang Chủ</button>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Giao diện</button>
        </div>
    </header>

    <div class="main-container">
        <div>
            <!-- THANH MENU & LỌC -->
            <div class="filter-bar">
                <div class="filter-row">
                    <span style="color:var(--accent-color); font-weight:bold; min-width:90px;">Danh mục:</span>
                    <button class="filter-btn active" onclick="switchTab('home')" id="menu-home">Trang chủ (A-Z)</button>
                    <button class="filter-btn" onclick="switchTab('recent')" id="menu-recent">Mới cập nhật</button>
                </div>

                <div class="filter-row">
                    <span style="color:var(--accent-color); font-weight:bold; min-width:90px;">Bối cảnh:</span>
                    <div id="context-buttons" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
                </div>

                <div class="filter-row" style="align-items: flex-start;">
                    <span style="color:var(--accent-color); font-weight:bold; min-width:90px; padding-top:4px;">Thể loại:</span>
                    <div class="checkbox-container" id="genre-checkbox-group"></div>
                </div>
            </div>

            <!-- KHU VỰC HIỂN THỊ TRUYỆN -->
            <div class="content-area">
                <div id="content-header" class="section-title">
                    <span>Tất Cả Truyện</span>
                </div>
                
                <div id="az-filter-container" class="az-filter"></div>

                <div id="stories-container">
                    <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu từ Google Sheets...</div>
                </div>

                <!-- THANH PHÂN TRANG -->
                <div id="pagination-container" class="pagination"></div>
            </div>
        </div>

        <!-- Sidebar Phải -->
        <div class="sidebar-right">
            <div class="widget">
                <h3>Tìm Kiếm Nhanh</h3>
                <input type="text" id="searchInput" class="search-box" placeholder="Nhập tên truyện..." onkeyup="handleSearch()">
            </div>

            <div class="widget">
                <h3>Liên Kết Thư Quán</h3>
                <div class="social-links">
                    <a href="https://www.facebook.com/dammythuquan/" target="_blank" class="social-btn facebook-fanpage">
                        <i class="fa-brands fa-facebook"></i> Fanpage Thư Quán
                    </a>
                    <a href="https://www.facebook.com/groups/29568439142757697" target="_blank" class="social-btn facebook-group">
                        <i class="fa-brands fa-facebook-f"></i> Group Thư Quán
                    </a>
                    <a href="https://dammythuquan.com/" target="_blank" class="social-btn web-link">
                        <i class="fa-solid fa-globe"></i> Web Đam Mỹ Thư Quán
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1S_0kWJhtX9VC57k-e0HL2cuAxL44zw1Wjgccc32aQXo';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        let allStories = [];
        let currentTab = 'home';
        let currentLetter = 'ALL';
        let currentContext = 'ALL';
        let selectedGenres = [];
        let currentPage = 1;
        const itemsPerPage = 30;

        // Đã thêm "Xuyên nhanh" vào danh sách bối cảnh
        const CONTEXT_LIST = ["Nguyên thủy", "Cổ đại", "Dân quốc", "Thập niên", "Hiện đại", "Tương lai", "Mạt thế", "Xuyên nhanh"];

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const btn = document.getElementById('themeToggleBtn');
            btn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-moon"></i> Giao diện' : '<i class="fa-solid fa-sun"></i> Giao diện';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
            fetchSheetData();
        });

        async function fetchSheetData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu:", error);
                document.getElementById('stories-container').innerHTML = `<p style="color: red; text-align: center;">Không thể tải dữ liệu từ Google Sheets. Vui lòng kiểm tra lại quyền chia sẻ file!</p>`;
            }
        }

        function createSlug(str) {
            if (!str) return '';
            str = str.toLowerCase();
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/([^0-9a-z-\s])/g, "");
            str = str.replace(/(\s+)/g, "-");
            str = str.replace(/-+(-+)/g, "-");
            str = str.replace(/^-+|-+$/g, "");
            return str;
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allStories = [];

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i];
                if (!line || !line.trim()) continue;

                // Tách cột chính xác theo định dạng Tab hoặc CSV của Google Sheets
                let cols = line.includes('\t') ? line.split('\t') : parseCSVLine(line);
                
                // Cột 0: Tên truyện, Cột 1: Thể loại
                let rawTitle = cols[0] || '';
                let rawGenres = cols[1] || '';

                let title = rawTitle.replace(/^"|"$/g, '').trim();
                let genresStr = rawGenres.replace(/^"|"$/g, '').trim();

                // Phòng trường hợp dòng bị đảo hoặc lệch, kiểm tra nếu cột 0 trống nhưng cột 1 có tên truyện
                if (!title && genresStr && !genresStr.includes(',')) {
                    // Đổi chỗ nếu phát hiện dữ liệu bị ngược
                    title = genresStr;
                    genresStr = rawTitle.replace(/^"|"$/g, '').trim();
                }

                if (title && title.toUpperCase() !== 'TÊN TRUYỆN') {
                    let genres = genresStr.split(',').map(g => g.trim()).filter(g => g);

                    // Nhận diện bối cảnh ưu tiên kiểm tra "Xuyên nhanh" trước
                    let context = "Khác";
                    for (let ctx of CONTEXT_LIST) {
                        if (genresStr.toLowerCase().includes(ctx.toLowerCase()) || title.toLowerCase().includes(ctx.toLowerCase())) {
                            context = ctx;
                            break;
                        }
                    }

                    let slug = createSlug(title);
                    let storyLink = `https://dammythuquan.com/truyen/${slug}`;

                    allStories.push({
                        title: title,
                        genres: genres,
                        context: context,
                        link: storyLink
                    });
                }
            }

            initTopFilters();
            renderContent();
        }

        function parseCSVLine(textLine) {
            let result = [];
            let insideQuotes = false;
            let currentVal = '';
            for (let i = 0; i < textLine.length; i++) {
                let char = textLine[i];
                if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === ',' && !insideQuotes) {
                    result.push(currentVal.trim().replace(/^"|"$/g, ''));
                    currentVal = '';
                } else {
                    currentVal += char;
                }
            }
            result.push(currentVal.trim().replace(/^"|"$/g, ''));
            return result;
        }

        function initTopFilters() {
            let ctxHtml = `<button class="filter-btn active" onclick="filterByContext('ALL')" id="ctx-ALL">Tất cả</button>`;
            CONTEXT_LIST.forEach(ctx => {
                ctxHtml += `<button class="filter-btn" onclick="filterByContext('${ctx}')" id="ctx-${ctx}">${ctx}</button>`;
            });
            document.getElementById('context-buttons').innerHTML = ctxHtml;

            let allGenresSet = new Set();
            allStories.forEach(story => {
                story.genres.forEach(g => allGenresSet.add(g));
            });

            let sortedGenres = Array.from(allGenresSet).sort((a, b) => a.localeCompare(b, 'vi'));
            let genreHtml = '';
            sortedGenres.forEach(genre => {
                genreHtml += `<label><input type="checkbox" value="${genre}" onchange="handleGenreChange()"> ${genre}</label>`;
            });
            document.getElementById('genre-checkbox-group').innerHTML = genreHtml;

            let azHtml = `<button class="az-btn active" onclick="filterByLetter('ALL')">Tất cả</button>`;
            for (let i = 65; i <= 90; i++) {
                let char = String.fromCharCode(i);
                azHtml += `<button class="az-btn" onclick="filterByLetter('${char}')" id="az-${char}">${char}</button>`;
            }
            document.getElementById('az-filter-container').innerHTML = azHtml;
        }

        function switchTab(tab) {
            currentTab = tab;
            currentContext = 'ALL';
            currentLetter = 'ALL';
            selectedGenres = [];
            currentPage = 1;
            
            document.querySelectorAll('.filter-row .filter-btn').forEach(el => {
                if(el.id === 'menu-home' || el.id === 'menu-recent') el.classList.remove('active');
            });
            if (tab === 'home') document.getElementById('menu-home').classList.add('active');
            if (tab === 'recent') document.getElementById('menu-recent').classList.add('active');

            document.querySelectorAll('#context-buttons .filter-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('ctx-ALL').classList.add('active');

            document.querySelectorAll('.checkbox-container input').forEach(cb => cb.checked = false);
            renderContent();
        }

        function filterByContext(ctx) {
            currentContext = ctx;
            currentTab = 'context';
            currentPage = 1;
            document.querySelectorAll('#context-buttons .filter-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`ctx-${ctx}`).classList.add('active');
            renderContent();
        }

        function filterByLetter(letter) {
            currentLetter = letter;
            currentPage = 1;
            document.querySelectorAll('.az-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            renderContent();
        }

        function handleGenreChange() {
            const checkboxes = document.querySelectorAll('.checkbox-container input:checked');
            selectedGenres = Array.from(checkboxes).map(cb => cb.value);
            currentPage = 1;
            renderContent();
        }

        function handleSearch() {
            currentPage = 1;
            renderContent();
        }

        function changePage(page) {
            currentPage = page;
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderContent() {
            let filtered = [...allStories];
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (currentTab === 'recent') {
                document.getElementById('content-header').innerHTML = `<span>Mới Cập Nhật</span>`;
                document.getElementById('az-filter-container').style.display = 'none';
                filtered.reverse();
            } else {
                document.getElementById('az-filter-container').style.display = 'flex';
                if (currentContext !== 'ALL') {
                    document.getElementById('content-header').innerHTML = `<span>Bối Cảnh: ${currentContext}</span>`;
                    filtered = filtered.filter(s => s.context === currentContext);
                } else {
                    document.getElementById('content-header').innerHTML = `<span>Trang Chủ - Sắp Xếp A-Z</span>`;
                    filtered.sort((a, b) => a.title.localeCompare(b.title, 'vi'));
                }

                if (currentLetter !== 'ALL' && currentContext === 'ALL') {
                    filtered = filtered.filter(s => s.title.toUpperCase().startsWith(currentLetter));
                }
            }

            if (selectedGenres.length > 0) {
                filtered = filtered.filter(s => selectedGenres.every(g => s.genres.includes(g)));
            }

            if (searchTerm) {
                filtered = filtered.filter(s => s.title.toLowerCase().includes(searchTerm));
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages > 0 ? totalPages : 1;

            const startIdx = (currentPage - 1) * itemsPerPage;
            const paginatedStories = filtered.slice(startIdx, startIdx + itemsPerPage);

            let container = document.getElementById('stories-container');
            if (paginatedStories.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; padding: 40px;">Không tìm thấy truyện phù hợp yêu cầu!</p>`;
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            let html = `<div class="story-grid">`;
            paginatedStories.forEach(story => {
                let tagsHtml = story.genres.map(g => `<span class="tag-badge">${g}</span>`).join('');
                html += `
                    <div class="story-card">
                        <div>
                            <div class="story-title">${story.title}</div>
                            <div class="story-meta">Bối cảnh: ${story.context}</div>
                            <div class="story-tags">${tagsHtml}</div>
                        </div>
                        <a href="${story.link}" target="_blank" class="read-btn">Đọc Truyện <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            let pageHtml = '';
            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    pageHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
            }
            document.getElementById('pagination-container').innerHTML = pageHtml;
        }
    </script>
</body>
</html>
